<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校园毕业设计网站</title>
    <link rel="stylesheet" href="shared/styles.css" />
  </head>
  <body>
    <main class="landing-page">
      <h1>校园毕业设计网站</h1>
      <p>三位同学的设计分别对应图书分享、活动报名和宿舍报修场景。</p>
      <div class="project-links">
        <a class="project-link" href="book/">
          <i data-lucide="book-open"></i>
          <h2>校园图书分享网站</h2>
          <p>图书浏览、搜索、发布、借阅申请、收藏和后台审核。</p>
        </a>
        <a class="project-link" href="activity/">
          <i data-lucide="calendar-check"></i>
          <h2>校园活动报名网站</h2>
          <p>活动浏览、分类搜索、在线报名、取消报名和后台管理。</p>
        </a>
        <a class="project-link" href="repair/">
          <i data-lucide="wrench"></i>
          <h2>校园宿舍报修网站</h2>
          <p>故障报修、任务派单、维修进度、完成确认和后台统计。</p>
        </a>
      </div>
    </main>
    <script src="shared/lucide.min.js"></script>
    <script>lucide.createIcons();</script>
  </body>
</html>
