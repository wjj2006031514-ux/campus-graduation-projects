<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校园宿舍报修网站</title>
    <link rel="icon" href="assets/site.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-site="repair">
    <header class="site-header">
      <div class="topbar">
        <button class="brand" type="button" data-route="home">
          <span class="brand-mark"><i data-lucide="layout-dashboard"></i></span>
          <span>
            <strong id="appName">校园网站</strong>
            <small id="appSubtitle"></small>
          </span>
        </button>
        <form class="global-search" id="globalSearchForm">
          <i data-lucide="search"></i>
          <input id="globalSearchInput" type="search" placeholder="输入关键词搜索" />
          <button type="submit">搜索</button>
        </form>
        <div class="header-actions" id="headerActions"></div>
      </div>
      <nav class="nav-row">
        <button type="button" data-route="home">
          <i data-lucide="house"></i><span data-label="home">首页</span>
        </button>
        <button type="button" data-route="list">
          <i data-lucide="layout-grid"></i><span data-label="list">全部信息</span>
        </button>
        <button type="button" data-route="publish">
          <i data-lucide="circle-plus"></i><span data-label="publish">发布</span>
        </button>
        <button type="button" data-route="workspace">
          <i data-lucide="clipboard-list"></i><span data-label="workspace">我的记录</span>
        </button>
        <button type="button" data-route="admin" data-roles="admin">
          <i data-lucide="settings"></i>后台管理
        </button>
        <button type="button" data-route="profile">
          <i data-lucide="user-round"></i>个人中心
        </button>
      </nav>
    </header>

    <main class="page">
      <section class="view" id="view-home">
        <div class="page-banner">
          <div>
            <span class="eyebrow" id="homeEyebrow"></span>
            <h1 id="homeTitle"></h1>
            <p id="homeDescription"></p>
          </div>
          <div class="banner-panel" id="homeNotice"></div>
        </div>
        <div class="stats-strip" id="homeStats"></div>
        <div class="section-head">
          <div>
            <h2 id="latestTitle">最新记录</h2>
            <p id="latestDescription"></p>
          </div>
          <button type="button" class="text-button" data-route="list">查看全部</button>
        </div>
        <div class="card-grid" id="homeGrid"></div>
      </section>

      <section class="view" id="view-list">
        <div class="page-head">
          <div>
            <h1 id="listTitle"></h1>
            <p id="listDescription"></p>
          </div>
        </div>
        <div class="filter-bar">
          <div class="filter-line">
            <span>分类</span>
            <div class="chip-list" id="categoryFilter"></div>
          </div>
          <div class="filter-line">
            <span>状态</span>
            <div class="chip-list" id="statusFilter"></div>
          </div>
        </div>
        <div class="card-grid" id="listGrid"></div>
      </section>

      <section class="view" id="view-publish">
        <div class="page-head">
          <div>
            <h1 id="publishTitle"></h1>
            <p id="publishDescription"></p>
          </div>
        </div>
        <form class="form-shell" id="itemForm">
          <div class="form-grid" id="itemFields"></div>
          <div class="form-actions">
            <button class="primary-button" type="submit">
              <i data-lucide="send"></i><span id="submitLabel">提交</span>
            </button>
            <button class="secondary-button" type="button" id="resetFormButton">
              <i data-lucide="rotate-ccw"></i>清空
            </button>
          </div>
        </form>
      </section>

      <section class="view" id="view-workspace">
        <div class="page-head">
          <div>
            <h1 id="workspaceTitle"></h1>
            <p id="workspaceDescription"></p>
          </div>
        </div>
        <div class="record-list" id="workspaceContent"></div>
      </section>

      <section class="view" id="view-admin">
        <div class="page-head">
          <div>
            <h1>后台管理</h1>
            <p>查看待审核记录和处理异常信息</p>
          </div>
        </div>
        <div class="stats-strip" id="adminStats"></div>
        <div class="admin-panel">
          <div class="section-head">
            <div>
              <h2>待审核记录</h2>
              <p id="pendingDescription"></p>
            </div>
          </div>
          <div class="record-list" id="pendingList"></div>
        </div>
        <div class="admin-panel" style="margin-top: 18px">
          <div class="section-head">
            <div>
              <h2>全部记录</h2>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>记录</th>
                  <th>分类</th>
                  <th>发布人</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="adminTable"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="view" id="view-profile">
        <div class="page-head">
          <div>
            <h1>个人中心</h1>
            <p>查看当前账号、角色和操作统计</p>
          </div>
        </div>
        <div class="profile-shell" id="profileContent"></div>
      </section>
    </main>

    <dialog id="authDialog" class="modal">
      <div class="modal-card">
        <button class="modal-close" type="button" data-close-dialog="authDialog">
          <i data-lucide="x"></i>
        </button>
        <h2 id="authTitle">登录</h2>
        <p class="demo-note">演示学生：student / 123456；管理员：admin / 123456</p>
        <div class="auth-tabs">
          <button type="button" class="active" data-auth-tab="login">登录</button>
          <button type="button" data-auth-tab="register">注册</button>
        </div>
        <form id="loginForm">
          <div class="field">
            <label for="loginUsername">用户名</label>
            <input id="loginUsername" name="username" required />
          </div>
          <div class="field">
            <label for="loginPassword">密码</label>
            <input id="loginPassword" name="password" type="password" required />
          </div>
          <div class="form-actions">
            <button class="primary-button" type="submit"><i data-lucide="log-in"></i>登录</button>
          </div>
        </form>
        <form id="registerForm" hidden>
          <div class="field">
            <label for="registerName">姓名</label>
            <input id="registerName" name="name" required />
          </div>
          <div class="field">
            <label for="registerUsername">用户名</label>
            <input id="registerUsername" name="username" required />
          </div>
          <div class="field">
            <label for="registerCollege">学院</label>
            <input id="registerCollege" name="college" value="信息工程学院" required />
          </div>
          <div class="field">
            <label for="registerPassword">密码</label>
            <input id="registerPassword" name="password" type="password" minlength="6" required />
          </div>
          <div class="field">
            <label for="registerConfirm">确认密码</label>
            <input id="registerConfirm" name="confirmPassword" type="password" minlength="6" required />
          </div>
          <div class="form-actions">
            <button class="primary-button" type="submit"><i data-lucide="user-plus"></i>注册并登录</button>
          </div>
        </form>
      </div>
    </dialog>

    <dialog id="detailDialog" class="modal">
      <div class="modal-card">
        <button class="modal-close" type="button" data-close-dialog="detailDialog">
          <i data-lucide="x"></i>
        </button>
        <div id="detailContent"></div>
      </div>
    </dialog>

    <dialog id="confirmDialog" class="modal">
      <div class="modal-card">
        <h2 id="confirmTitle">确认操作</h2>
        <p id="confirmMessage"></p>
        <div class="form-actions">
          <button class="secondary-button" type="button" id="confirmCancelButton">取消</button>
          <button class="danger-button" type="button" id="confirmActionButton">确认</button>
        </div>
      </div>
    </dialog>

    <div class="toast" id="toast"></div>
    <script src="assets/lucide.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
